<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/styles.css">
    <title>Recipe Finder</title>
</head>
<body>
    <div class="contain-all">
        <header class="nav-bar">
            <div class="nav-bar-text">
                <h1>🍜 Recipe Finder <br></h1>
                <h3>Explore Mouth Drooling Recipes to fulfill your cravings!</h3> 
            </div>
            <form action="" class="nav-bar-search-form">
                <input type="text" placeholder="Enter a Dish Name (e.g., Spaghetti, Chicken, Pasta)" id="search-form-input" class="form-input">
                <button id="Search-form-button" class="form-button">Search</button>
            </form>
            <div class="error-text"></div>
        </header>
        <main class="search-results">
            <section class="results-view view">
                <div class="heading"><h1>Search Results</h1></div>
                <section class="search-results-cards">
                    <p class="search-error">No recipe searched till now. What are you waiting for?</p>
                </section>
            </section>
            <section class="detailed-view view is-hidden"></section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
